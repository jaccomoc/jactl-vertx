import org.gradle.jvm.toolchain.JavaLanguageVersion

plugins {
  id 'java'
  id 'maven-publish'
  id 'signing'
  id 'me.champeau.jmh' version '0.7.3'
}

group   'io.jactl'
version '2.9.2'

repositories {
  mavenLocal()
  mavenCentral()
}

java {
  withJavadocJar()
  withSourcesJar()
  sourceCompatibility = "1.8"
  targetCompatibility = "1.8"
}

jmh {
  jmhVersion = '1.37'
  // Restrict which benchmarks run, e.g.: ./gradlew jmh -PjmhInclude=VirtualThread
  // Comma-separated list of regexes matched against the fully-qualified benchmark name
  // (JMH does a "contains" match, so plain substrings like "VirtualThread" work as wildcards too).
  if (project.hasProperty('jmhInclude')) {
    includes = project.property('jmhInclude').toString().split(',').collect { it.trim() }
  }

  // Override fork count / warmup / measurement iterations, e.g.:
  //   ./gradlew jmh -PjmhFork=3 -PjmhWarmupIterations=5 -PjmhIterations=10
  // Falls back to each benchmark class's @Fork/@Warmup/@Measurement annotations when not set.
  if (project.hasProperty('jmhFork')) {
    fork = project.property('jmhFork').toString().toInteger()
  }
  if (project.hasProperty('jmhWarmupIterations')) {
    warmupIterations = project.property('jmhWarmupIterations').toString().toInteger()
  }
  if (project.hasProperty('jmhIterations')) {
    iterations = project.property('jmhIterations').toString().toInteger()
  }
}

// Which JVM actually runs the benchmarks, e.g.: ./gradlew jmh -PjmhJavaVersion=21
// Defaults to 25. Must be >= 21 since the jmh source set is compiled targeting Java 21 (see below).
def jmhJavaVersion = project.hasProperty('jmhJavaVersion') ? project.property('jmhJavaVersion').toString().toInteger() : 25

tasks.named('jmhRunBytecodeGenerator') {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(jmhJavaVersion)
  }
}

tasks.named('jmh') {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(jmhJavaVersion)
  }
}

// Compile the jmh source set itself (and the classes the bytecode generator produces from it) against
// Java 21+ so benchmarks can use virtual threads etc, without touching the main library's Java 8 compatibility.
tasks.named('compileJmhJava') {
  javaCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
  sourceCompatibility = '21'
  targetCompatibility = '21'
}

// Needs a 21+ compiler too, since it compiles JMH-generated wrapper classes against compileJmhJava's
// class-21 output on its classpath.
tasks.named('jmhCompileGeneratedClasses') {
  javaCompiler = javaToolchains.compilerFor {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

dependencies {
  implementation group: 'io.jactl', name: 'jactl',            version: '2.9.2'
  implementation group: 'io.vertx', name: 'vertx-core',       version: '4.5.33'
  implementation group: 'io.vertx', name: 'vertx-web',        version: '4.5.33'
  implementation group: 'io.vertx', name: 'vertx-web-client', version: '4.5.33'
  implementation group: 'io.vertx', name: 'vertx-hazelcast',  version: '4.5.33'
  implementation group: 'com.hazelcast', name: 'hazelcast-kubernetes', version: '2.2.3'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
  testImplementation 'io.vertx:vertx-junit5:4.5.33'
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:5.9.2'

  jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'

  def isMacOS = System.getProperty('os.name').startsWith('Mac OS X')
  def architecture = System.getProperty('os.arch').toLowerCase()
  if (isMacOS && architecture == 'aarch64') {
    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.90.Final:osx-aarch_64'
  }
}

test {
  useJUnitPlatform()
}

